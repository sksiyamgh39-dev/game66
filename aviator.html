<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator - Spribe Style</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0e131b; color: #fff; text-align: center; }
        
        .header { background: #171f2c; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #232e3e; }
        .back-btn { background: #e53935; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .bal-box { background: #000; padding: 4px 10px; border-radius: 15px; border: 1px solid #333; color: #2ecc71; font-weight: bold; }

        .history-bar { background: #121822; padding: 8px; display: flex; gap: 8px; overflow-x: auto; border-bottom: 1px solid #232e3e; }
        .hist-item { background: #1c2636; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; color: #3498db; }

        .game-container { position: relative; width: 92%; max-width: 420px; height: 230px; margin: 15px auto; background: #000; border-radius: 10px; border: 1px solid #232e3e; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        
        .multiplier-text { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 45px; font-weight: 900; color: #fff; z-index: 10; text-shadow: 0 0 10px rgba(0,0,0,0.8); }

        .bet-box { width: 92%; max-width: 420px; margin: 0 auto; background: #171f2c; padding: 15px; border-radius: 10px; border: 1px solid #232e3e; }
        .ctrl-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .amt-btn { background: #232e3e; color: #fff; border: none; width: 35px; height: 35px; border-radius: 6px; font-size: 20px; font-weight: bold; cursor: pointer; }
        .amt-input { width: 80px; height: 35px; background: #0e131b; border: 1px solid #333; color: #fff; text-align: center; font-size: 16px; font-weight: bold; border-radius: 6px; }
        
        .preset-btns { display: flex; gap: 5px; }
        .p-btn { background: #232e3e; border: none; color: #aaa; padding: 8px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }

        .action-btn { width: 100%; padding: 14px; font-size: 20px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-bet { background: #2ecc71; color: #fff; box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3); }
        .btn-cashout { background: #f1c40f; color: #000; box-shadow: 0 4px 12px rgba(241, 196, 15, 0.4); }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="history.back()">⬅ Back</button>
        <span style="color:#e53935; font-weight:bold; font-size:20px;">Aviator</span>
        <div class="bal-box">BDT <span id="bal">500.00</span></div>
    </div>

    <div class="history-bar" id="histBar">
        <span class="hist-item" style="color:#9b59b6;">1.20x</span>
        <span class="hist-item">2.45x</span>
        <span class="hist-item" style="color:#e74c3c;">1.05x</span>
        <span class="hist-item">5.10x</span>
    </div>

    <div class="game-container">
        <div class="multiplier-text" id="multText">1.00x</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="bet-box">
        <div class="ctrl-row">
            <div style="display:flex; align-items:center; gap:5px;">
                <button class="amt-btn" onclick="addAmt(-10)">-</button>
                <input type="number" id="betAmt" class="amt-input" value="10">
                <button class="amt-btn" onclick="addAmt(10)">+</button>
            </div>
            <div class="preset-btns">
                <button class="p-btn" onclick="setAmt(50)">50</button>
                <button class="p-btn" onclick="setAmt(100)">100</button>
                <button class="p-btn" onclick="setAmt(500)">500</button>
            </div>
        </div>
        <button class="action-btn btn-bet" id="mainBtn" onclick="handleAction()">BET ৳10</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        let balance = 500.00;
        let betAmount = 10;
        let isBetPlaced = false;
        let isCashedOut = false;
        let isRunning = false;

        let multiplier = 1.00;
        let crashPoint = 1.00;
        let animationFrame;
        let planeX = 0;
        let planeY = 0;

        function addAmt(val) {
            let elem = document.getElementById('betAmt');
            let curr = parseInt(elem.value) || 0;
            if(curr + val >= 10) elem.value = curr + val;
            updateBtn();
        }

        function setAmt(val) {
            document.getElementById('betAmt').value = val;
            updateBtn();
        }

        function updateBtn() {
            if(!isBetPlaced) {
                betAmount = parseFloat(document.getElementById('betAmt').value);
                document.getElementById('mainBtn').innerText = `BET ৳${betAmount}`;
            }
        }

        function handleAction() {
            let btn = document.getElementById('mainBtn');
            betAmount = parseFloat(document.getElementById('betAmt').value);

            if(!isBetPlaced) {
                if(balance < betAmount) {
                    alert('পর্যাপ্ত ব্যালেন্স নেই!');
                    return;
                }
                balance -= betAmount;
                document.getElementById('bal').innerText = balance.toFixed(2);
                isBetPlaced = true;
                isCashedOut = false;
                
                btn.className = 'action-btn btn-cashout';
                btn.innerText = `CASH OUT ৳${(betAmount * multiplier).toFixed(2)}`;
            } else if(isRunning && !isCashedOut) {
                isCashedOut = true;
                let win = betAmount * multiplier;
                balance += win;
                document.getElementById('bal').innerText = balance.toFixed(2);
                
                btn.className = 'action-btn btn-bet';
                btn.innerText = `WON ৳${win.toFixed(2)}`;
            }
        }

        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Line Curve
            if(isRunning) {
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                ctx.quadraticCurveTo(planeX / 2, canvas.height, planeX, planeY);
                ctx.strokeStyle = '#e53935';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Draw Plane
                ctx.font = '28px Arial';
                ctx.fillText('✈️', planeX - 15, planeY + 10);
            }
        }

        function startRound() {
            isRunning = true;
            multiplier = 1.00;
            crashPoint = (Math.random() * 3 + 1.1).toFixed(2);
            
            planeX = 20;
            planeY = canvas.height - 20;
            
            let btn = document.getElementById('mainBtn');
            document.getElementById('multText').style.color = '#fff';

            let timer = setInterval(() => {
                multiplier += 0.02;
                document.getElementById('multText').innerText = multiplier.toFixed(2) + 'x';

                planeX = Math.min(canvas.width - 40, planeX + 2);
                planeY = Math.max(30, canvas.height - (multiplier * 35));

                if(isBetPlaced && !isCashedOut) {
                    btn.innerText = `CASH OUT ৳${(betAmount * multiplier).toFixed(2)}`;
                }

                drawGraph();

                if(multiplier >= crashPoint) {
                    clearInterval(timer);
                    isRunning = false;
                    document.getElementById('multText').innerText = 'FLEW AWAY!';
                    document.getElementById('multText').style.color = '#e53935';

                    if(isBetPlaced && !isCashedOut) {
                        btn.className = 'action-btn btn-bet';
                        isBetPlaced = false;
                        updateBtn();
                    }

                    setTimeout(() => {
                        isBetPlaced = false;
                        updateBtn();
                        startRound();
                    }, 2500);
                }
            }, 80);
        }

        setTimeout(startRound, 1000);
    </script>
</body>
</html>
