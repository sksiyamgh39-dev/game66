<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game</title>
    <style>
        body { margin: 0; background: #1b1c1d; font-family: Arial, sans-serif; color: #fff; text-align: center; }
        .header { background: #2b2c2d; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff1744; }
        .back-btn { background: #ff1744; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .game-box { margin: 40px auto; width: 90%; max-width: 400px; background: #000; height: 260px; border-radius: 12px; border: 2px solid #ff1744; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .multiplier { font-size: 48px; font-weight: bold; color: #ff1744; }
        .plane { font-size: 50px; margin-bottom: 10px; transition: 0.2s; }
        .bet-btn { background: #28a745; color: #fff; border: none; padding: 12px 30px; font-size: 18px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="history.back()">⬅ Back</button>
        <h3>✈️ Aviator</h3>
        <div><b>৳<span id="bal">500.00</span></b></div>
    </div>

    <div class="game-box">
        <div class="plane" id="plane">✈️</div>
        <div class="multiplier" id="mult">1.00x</div>
    </div>

    <button class="bet-btn" onclick="startFly()">BET ৳10</button>

    <script>
        let running = false;
        function startFly() {
            if(running) return;
            running = true;
            let m = 1.00;
            let elem = document.getElementById('mult');
            let plane = document.getElementById('plane');
            plane.style.transform = 'translateY(-20px)';
            
            let timer = setInterval(() => {
                m += 0.05;
                elem.innerText = m.toFixed(2) + 'x';
                if(Math.random() < 0.05) {
                    clearInterval(timer);
                    elem.innerText = 'FLEW AWAY!';
                    elem.style.color = '#dc3545';
                    plane.style.transform = 'translateY(-80px)';
                    setTimeout(() => {
                        elem.innerText = '1.00x';
                        elem.style.color = '#ff1744';
                        plane.style.transform = 'translateY(0px)';
                        running = false;
                    }, 2000);
                }
            }, 100);
        }
    </script>

</body>
</html>
