<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator - Spribe Style</title>
    <style>
        body { margin: 0; background: #0f141c; font-family: Arial, sans-serif; color: #fff; text-align: center; }
        .header { background: #18202c; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #293548; }
        .back-btn { background: #e53935; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        /* History Bar */
        .history-bar { background: #131922; padding: 6px; display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; justify-content: center; border-bottom: 1px solid #222; }
        .hist-item { background: #1c2634; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #4cd137; }
        
        /* Game Screen */
        .game-box { margin: 10px auto; width: 94%; max-width: 450px; background: #000; height: 210px; border-radius: 8px; border: 1px solid #293548; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .multiplier { font-size: 42px; font-weight: bold; color: #fff; z-index: 2; }
        .plane { font-size: 45px; position: absolute; transition: 0.1s; z-index: 1; }
        
        /* Bet Panel Container */
        .bet-container { width: 94%; max-width: 450px; margin: 0 auto 15px auto; display: flex; flex-direction: column; gap: 10px; }
        .bet-box { background: #18202c; padding: 12px; border-radius: 8px; border: 1px solid #293548; display: flex; flex-direction: column; gap: 8px; }
        
        .bet-row-top { display: flex; justify-content: space-between; align-items: center; }
        .amount-ctrl { display: flex; align-items: center; background: #0f141c; border-radius: 6px; border: 1px solid #293548; overflow: hidden; }
        .amount-ctrl button { background: #222f3e; color: #fff; border: none; padding: 6px 12px; font-size: 16px; cursor: pointer; }
        .amount-ctrl input { background: transparent; border: none; color: #fff; width: 60px; text-align: center; font-size: 16px; font-weight: bold; outline: none; }
        
        .preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .preset-btn { background: #222f3e; border: none; color: #aaa; padding: 4px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        
        /* Action Button */
        .action-btn { width: 100%; padding: 12px; font-size: 18px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-bet { background: #2ecc71; color: #fff; }
        .btn-cashout { background: #f39c12; color: #fff; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="history.back()">⬅ Back</button>
        <span style="color:#e53935; font-weight:bold; font-size:18px;">Aviator</span>
        <div><b>BDT <span id="bal">500.00</span></b></div>
    </div>

    <!-- History Bar -->
    <div class="history-bar" id="historyBar">
        <span class="hist-item">1.45x</span>
        <span class="hist-item">2.10x</span>
        <span class="hist-item">1.02x</span>
        <span class="hist-item">5.30x</span>
    </div>

    <!-- Game Screen -->
    <div class="game-box">
        <div class="plane" id="plane" style="left: 20px; bottom: 20px;">✈️</div>
        <div class="multiplier" id="mult">1.00x</div>
    </div>

    <!-- Bet Panels -->
    <div class="bet-container">
        <!-- Panel 1 -->
        <div class="bet-box">
            <div class="bet-row-top">
                <div class="amount-ctrl">
                    <button onclick="changeAmt(-10)">-</button>
                    <input type="number" id="betAmt1" value="10">
                    <button onclick="changeAmt(10)">+</button>
                </div>
                <div class="preset-grid">
                    <button class="preset-btn" onclick="setAmt(50)">50</button>
                    <button class="preset-btn" onclick="setAmt(100)">100</button>
                    <button class="preset-btn" onclick="setAmt(500)">500</button>
                    <button class="preset-btn" onclick="setAmt(1000)">1000</button>
                </div>
            </div>
            <button class="action-btn btn-bet" id="mainBtn1" onclick="toggleBet()">BET ৳10</button>
        </div>
    </div>

    <script>
        let balance = 500.00;
        let isPlaying = false;
        let currentMultiplier = 1.00;
        let gameTimer = null;
        let hasBetted = false;
        let cashedOut = false;

        function setAmt(val) {
            document.getElementById('betAmt1').value = val;
            updateBtnText();
        }

        function changeAmt(val) {
            let input = document.getElementById('betAmt1');
            let current = parseInt(input.value) || 0;
            let res = current + val;
            if(res >= 10) input.value = res;
            updateBtnText();
        }

        function updateBtnText() {
            let amt = document.getElementById('betAmt1').value;
            if(!hasBetted) {
                document.getElementById('mainBtn1').innerText = `BET ৳${amt}`;
            }
        }

        function toggleBet() {
            let amt = parseFloat(document.getElementById('betAmt1').value);
            if(!hasBetted) {
                if(balance < amt) {
                    alert('Insufficient balance!');
                    return;
                }
                balance -= amt;
                document.getElementById('bal').innerText = balance.toFixed(2);
                hasBetted = true;
                cashedOut = false;
                
                let btn = document.getElementById('mainBtn1');
                btn.className = 'action-btn btn-cashout';
                btn.innerText = `CASH OUT ৳${amt}`;

                if(!isPlaying) {
                    startRound();
                }
            } else {
                // Cash Out
                if(isPlaying && !cashedOut) {
                    cashedOut = true;
                    let winAmount = amt * currentMultiplier;
                    balance += winAmount;
                    document.getElementById('bal').innerText = balance.toFixed(2);
                    
                    let btn = document.getElementById('mainBtn1');
                    btn.className = 'action-btn btn-bet';
                    btn.innerText = `WON ৳${winAmount.toFixed(2)}`;
                    setTimeout(() => {
                        hasBetted = false;
                        updateBtnText();
                    }, 2000);
                }
            }
        }

        function startRound() {
            isPlaying = true;
            currentMultiplier = 1.00;
            let multElem = document.getElementById('mult');
            let plane = document.getElementById('plane');
            let crashPoint = (Math.random() * 4 + 1.1).toFixed(2); // Random crash between 1.10x and 5.00x

            plane.style.left = '20px';
            plane.style.bottom = '20px';

            gameTimer = setInterval(() => {
                currentMultiplier += 0.03;
                multElem.innerText = currentMultiplier.toFixed(2) + 'x';
                multElem.style.color = '#fff';
                
                // Move plane slightly
                let leftPos = Math.min(250, 20 + (currentMultiplier * 40));
                let bottomPos = Math.min(140, 20 + (currentMultiplier * 25));
                plane.style.left = leftPos + 'px';
                plane.style.bottom = bottomPos + 'px';

                if(currentMultiplier >= crashPoint) {
                    clearInterval(gameTimer);
                    multElem.innerText = 'FLEW AWAY!';
                    multElem.style.color = '#e53935';
                    
                    // If user placed a bet but didn't cash out
                    if(hasBetted && !cashedOut) {
                        let btn = document.getElementById('mainBtn1');
                        btn.className = 'action-btn btn-bet';
                        hasBetted = false;
                        updateBtnText();
                    }

                    // Reset after 3 seconds
                    setTimeout(() => {
                        isPlaying = false;
                        multElem.innerText = '1.00x';
                        startRound(); // Auto start next round
                    }, 3000);
                }
            }, 100);
        }

        // Auto start first round on load
        setTimeout(startRound, 1500);
    </script>
</body>
</html>
