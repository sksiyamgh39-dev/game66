<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-box">
        <h2>অ্যাকাউন্টে প্রবেশ করুন</h2>
        <form>
            <div class="input-box">
                <input type="text" placeholder="ফোন নম্বর বা ইমেইল" required>
            </div>
            <div class="input-box">
                <input type="password" placeholder="পাসওয়ার্ড" required>
            </div>
            <button type="submit" class="btn">লগইন</button>
        </form>
    </div>
</body>
</html>
