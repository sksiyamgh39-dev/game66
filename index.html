<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game66 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
            padding-bottom: 70px;
        }
        .user-card {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            padding: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avatar {
            width: 60px;
            height: 60px;
            background: #e0e0e0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #1976d2;
        }
        .user-info h3 {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .user-info p {
            font-size: 14px;
            opacity: 0.9;
        }
        .balance-card {
            background: #fff;
            margin: -15px 15px 20px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .balance-title {
            color: #666;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            color: #111;
            margin-bottom: 20px;
        }
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .action-btn {
            background: #f8f9fa;
            border: none;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
        }
        .games-section {
            padding: 0 15px;
        }
        .games-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #333;
        }
        .game-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .game-btn {
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #eee;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: #666;
            text-decoration: none;
        }
        .nav-item.active {
            color: #007bff;
        }
        
        /* Pop-up Modal CSS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 360px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            position: relative;
        }
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 10px;
        }
        .notice-text {
            font-size: 13px;
            color: #d9534f;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .number-box {
            background: #e9ecef;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin: 8px 0;
            letter-spacing: 1px;
        }
        .input-box {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .copy-btn, .submit-btn, .close-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .copy-btn { background: #17a2b8; color: white; }
        .submit-btn { background: #28a745; color: white; }
        .close-btn { background: #dc3545; color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="user-card">
        <div class="avatar">👤</div>
        <div class="user-info">
            <h3>DEMO MEMBER</h3>
            <p>UID | 451840</p>
            <p>Last login: Demo</p>
        </div>
    </div>

    <div class="balance-card">
        <div class="balance-title">Total balance</div>
        <div class="balance-amount">৳1000.00</div>
        
        <div class="action-grid">
            <button class="action-btn" onclick="openDeposit()">💰 Deposit</button>
            <button class="action-btn" onclick="openGame('Withdraw')">💳 Withdraw</button>
            <button class="action-btn" onclick="openGame('Wallet')">👛 Wallet</button>
            <button class="action-btn" onclick="openGame('VIP')">💎 VIP</button>
        </div>
    </div>

    <div class="games-section">
        <div class="games-title">Games</div>
        <div class="game-list">
            <button class="game-btn" onclick="openGame('Aviator')">Aviator</button>
            <button class="game-btn" onclick="openGame('Win Go')">Win Go</button>
            <button class="game-btn" onclick="openGame('Boom')">Boom</button>
            <button class="game-btn" onclick="openGame('Chicken Road')">Chicken Road</button>
            <button class="game-btn" onclick="openGame('Go Rush')">Go Rush</button>
            <button class="game-btn" onclick="openGame('Money Coming')">Money Coming</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item active">🏠 Home</a>
        <a href="#" class="nav-item" onclick="openDeposit()">🎁 Deposit</a>
        <a href="#" class="nav-item">✈️ Game</a>
        <a href="#" class="nav-item">👤 Account</a>
    </div>
</div>

<!-- Deposit Modal Popup -->
<div class="modal" id="depositModal">
    <div class="modal-content">
        <div class="modal-title">💰 Deposit Info</div>
        <p class="notice-text">⚠️ শুধুমাত্র সেন্ড মানি করে ডিপোজিট করবেন। ৫ মিনিটের ভেতরে টাকা পেয়ে যাবেন।</p>
        <p style="font-size: 13px; color: #555;">বিকাশ/নগদ/রকেট পার্সোনাল নাম্বার:</p>
        <div class="number-box" id="num">01906531772</div>
        
        <button class="copy-btn" onclick="copyNumber()">Copy Number</button>

        <hr style="margin: 15px 0; border: 0.5px solid #eee;">

        <input type="number" id="amount" class="input-box" placeholder="টাকার পরিমাণ লিখুন (Amount)">
        <input type="text" id="trxId" class="input-box" placeholder="ট্রানজেকশন আইডি লিখুন (TrxID)">

        <div class="btn-group">
            <button class="submit-btn" onclick="submitDeposit()">Submit</button>
            <button class="close-btn" onclick="closeDeposit()">Close</button>
        </div>
    </div>
</div>

<script>
    function openGame(name) {
        alert(name + ' অপশনটি শীঘ্রই চালু হবে!');
    }

    function openDeposit() {
        document.getElementById('depositModal').style.display = 'flex';
    }

    function closeDeposit() {
        document.getElementById('depositModal').style.display = 'none';
    }

    function copyNumber() {
        var numText = document.getElementById('num').innerText;
        navigator.clipboard.writeText(numText);
        alert('নাম্বারটি কপি করা হয়েছে: ' + numText);
    }

    function submitDeposit() {
        var amount = document.getElementById('amount').value;
        var trx = document.getElementById('trxId').value;

        if(!amount || !trx) {
            alert('অনুগ্রহ করে টাকার পরিমাণ এবং TrxID দিন!');
            return;
        }

        alert('আপনার ডিপোজিট রিকোয়েস্ট সফল হয়েছে!\nপরিমাণ: ৳' + amount + '\nTrxID: ' + trx);
        document.getElementById('amount').value = '';
        document.getElementById('trxId').value = '';
        closeDeposit();
    }
</script>

</body>
</html>
