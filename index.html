<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Casino Website</title>
    <!-- FontAwesome আইকনের সিডিএন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a2332;
            color: #ffffff;
            padding: 10px;
            padding-bottom: 50px;
        }

        .casino-container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* হেডার ডিজাইন */
        .casino-header {
            background: linear-gradient(90deg, #ff8c00, #ff5e00);
            width: 75%;
            border-radius: 8px 30px 30px 8px;
            padding: 10px 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(255, 140, 0, 0.3);
        }

        .header-title {
            display: flex;
            flex-direction: column;
        }

        .header-title .rec {
            font-size: 13px;
            font-style: italic;
            font-weight: bold;
            color: #fff;
        }

        .header-title .live {
            font-size: 18px;
            font-weight: 900;
            color: #e0f7ff;
        }

        /* গেম গ্রিড লেআউট */
        .casino-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .casino-card {
            background: #243044;
            border-radius: 10px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .card-img {
            width: 100%;
            height: 110px;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            display: flex;
            justify-content: flex-end;
            padding: 6px;
        }

        .fav-icon {
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px;
            border-radius: 50%;
            height: 25px;
            width: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .casino-card p {
            font-size: 12px;
            color: #b0bec5;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ডানপাশের ফ্লোটিং বাটন */
        .floating-widgets {
            position: fixed;
            right: 15px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 999;
        }

        .float-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 3px solid #ffaa00;
        }

        .share-btn {
            background: #ffcc00;
            color: #1a2332;
            font-size: 10px;
            font-weight: bold;
        }

        .share-btn i {
            font-size: 14px;
            margin-bottom: 2px;
        }

        .whatsapp-btn {
            background: #25d366;
            font-size: 24px;
        }

        .telegram-btn {
            background: #0088cc;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div class="casino-container">
        <!-- ব্যানার বা হেডার -->
        <div class="casino-header">
            <div class="header-title">
                <span class="rec">RECOMMENDED</span>
                <span class="live">LIVE CASINO</span>
            </div>
        </div>

        <!-- গেম লিস্ট -->
        <div class="casino-grid">
            <div class="casino-card">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=300');">
                    <i class="fa-regular fa-heart fav-icon"></i>
                </div>
                <p>Crazy Time</p>
            </div>
            <div class="casino-card">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1511193311914-0346f16efe90?w=300');">
                    <i class="fa-regular fa-heart fav-icon"></i>
                </div>
                <p>Ice Fishing</p>
            </div>
            <div class="casino-card">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1596838132731-3301c3fd4317?w=300');">
                    <i class="fa-regular fa-heart fav-icon"></i>
                </div>
                <p>Bac Bo</p>
            </div>
        </div>
    </div>

    <!-- ফ্লোটিং বাটন (WhatsApp ও Telegram) -->
    <div class="floating-widgets">
        <a href="#" class="float-btn share-btn">
            <i class="fa-solid fa-share"></i>
            <span>INDIQUE</span>
        </a>
        <!-- আপনার হোয়াটসঅ্যাপ নম্বর এখানে যুক্ত করা হয়েছে -->
        <a href="https://wa.me/8801906531772" target="_blank" class="float-btn whatsapp-btn">
            <i class="fa-brands fa-whatsapp"></i>
        </a>
        <a href="https://t.me/your-username" target="_blank" class="float-btn telegram-btn">
            <i class="fa-brands fa-telegram"></i>
        </a>
    </div>

</body>
</html>
