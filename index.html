<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6fa; display: flex; justify-content: center; color: #333; }
        .app-container { width: 100%; max-width: 480px; background: #f4f6fa; min-height: 100vh; position: relative; padding-bottom: 80px; }
        .profile-header { background: linear-gradient(180deg, #ffc107 0%, #ff9800 100%); padding: 25px 20px 60px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; display: flex; align-items: center; gap: 15px; }
        .avatar-img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
        .user-details { color: #fff; }
        .username { font-size: 16px; font-weight: bold; }
        .vip-badge { background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.6); padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .uid-text { font-size: 13px; opacity: 0.9; margin-top: 3px; }
        .balance-card { background: #fff; margin: -40px 15px 15px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .balance-val { font-size: 28px; font-weight: bold; color: #111; margin: 5px 0 20px; display: flex; align-items: center; gap: 10px; }
        .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
        .action-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; text-decoration: none; color: #333; }
        .action-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .icon-wallet { background: #ffebee; } .icon-deposit { background: #fff3e0; } .icon-withdraw { background: #e3f2fd; } .icon-vip { background: #e8f5e9; }
        .play-game-btn { background: #ff9800; color: #fff; text-align: center; padding: 14px; margin: 0 15px 15px; border-radius: 12px; font-weight: bold; text-decoration: none; display: block; box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3); }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: #fff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eee; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #888; text-decoration: none; }
        .nav-item.active { color: #ff9800; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="profile-header">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200" class="avatar-img">
        <div class="user-details">
            <div><span class="username">MEMBERNNGNFEU3</span> <span class="vip-badge">VIP0</span></div>
            <div class="uid-text">UID | 451840</div>
        </div>
    </div>

    <div class="balance-card">
        <div style="font-size: 13px; color: #666;">Total balance</div>
        <div class="balance-val">৳<span id="userBal">0.00</span></div>
        <div class="action-grid">
            <a href="aviator.html" class="action-item"><div class="action-icon icon-wallet">✈️</div><div style="font-size: 12px;">Aviator</div></a>
            <div class="action-item" onclick="alert('ডিপোজিট করুন')"><div class="action-icon icon-deposit">💰</div><div style="font-size: 12px;">Deposit</div></div>
            <div class="action-item" onclick="alert('উইথড্র করুন')"><div class="action-icon icon-withdraw">💳</div><div style="font-size: 12px;">Withdraw</div></div>
            <div class="action-item"><div class="action-icon icon-vip">💎</div><div style="font-size: 12px;">VIP</div></div>
        </div>
    </div>

    <a href="aviator.html" class="play-game-btn">🎮 ✈️ Aviator Live গেম খেলুন</a>

    <div class="bottom-nav">
        <a href="aviator.html" class="nav-item"><span>🎮</span>Home</a>
        <a href="#" class="nav-item"><span>🎁</span>Activity</a>
        <a href="#" class="nav-item active"><span>👤</span>Account</a>
    </div>
</div>

<script>
    let currentBal = localStorage.getItem('user_balance') || 1000;
    document.getElementById('userBal').innerText = parseFloat(currentBal).toFixed(2);
</script>
</body>
</html>
