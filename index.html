        .              <!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CK44 - Official Gaming Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            background-color: #0b1e1d;
            color: #ffffff;
            padding: 15px;
        }
        /* লোগো ও ব্র্যান্ডিং */
        .brand-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .brand-logo {
            background: linear-gradient(135deg, #d4af37, #aa771c);
            color: #0b1e1d;
            font-size: 20px;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 8px;
            display: inline-block;
            border: 2px solid #e5c158;
            letter-spacing: 2px;
        }
        .brand-sub {
            font-size: 22px;
            font-weight: bold;
            color: #e5c158;
            margin-top: 5px;
        }
        .brand-sub span {
            color: #2ecc71;
        }

        /* লগইন ফর্ম স্টাইল */
        .auth-container {
            background: rgba(15, 31, 30, 0.95);
            border: 1px solid #1b3b38;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .auth-title {
            text-align: center;
            font-size: 20px;
            color: #e5c158;
            margin-bottom: 5px;
        }
        .auth-subtitle {
            text-align: center;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 15px;
        }
        .auth-subtitle a {
            color: #2ecc71;
            text-decoration: none;
            font-weight: bold;
        }
        .input-group {
            position: relative;
            margin-bottom: 12px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            background: #0f1f1e;
            border: 1px solid #1b3b38;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        .input-group span {
            position: absolute;
            left: 12px;
            top: 14px;
            color: #2ecc71;
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 15px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .forgot-pass {
            color: #e5c158;
            text-decoration: none;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: #000;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .social-login {
            text-align: center;
            border-top: 1px solid #1b3b38;
            padding-top: 15px;
        }
        .social-login p {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 10px;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1b3b38;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #234e4a;
            cursor: pointer;
        }

        /* গেম সেকশন গ্রিড */
        .section-title {
            font-size: 18px;
            color: #e5c158;
            margin-bottom: 15px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .game-card {
            background: #1a3330;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            border: 1px solid #2a4d48;
        }
        .game-card img {
            width: 100%;
            height: 90px;
            object-fit: cover;
        }
        .game-card span {
            display: block;
            padding: 5px;
            font-size: 12px;
            background: #112624;
            color: #d4af37;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ব্র্যান্ডিং লোগো -->
    <div class="brand-header">
        <div class="brand-logo">CK44</div>
        <div class="brand-sub">CK44 <span>wintk</span></div>
    </div>

    <!-- লগইন ফর্ম সেকশন -->
    <div class="auth-container">
        <div class="auth-title">Login</div>
        <div class="auth-subtitle">No account yet? <a href="#">Register</a></div>
        
        <div class="input-group">
            <span>📞</span>
            <input type="text" placeholder="Phone number">
        </div>
        <div class="input-group">
            <span>🔒</span>
            <input type="password" placeholder="Password">
        </div>

        <div class="form-options">
            <label class="remember-me">
                <input type="checkbox" checked> Remember
            </label>
            <a href="#" class="forgot-pass">Forgot password?</a>
        </div>

        <button class="submit-btn">Login</button>

        <div class="social-login">
            <p>Or Connect With</p>
            <div class="social-icons">
                <div class="social-btn" style="background: #3b5998;">f</div>
                <div class="social-btn" style="background: #db4437;">G</div>
            </div>
        </div>
    </div>

    <!-- হট গেমস সেকশন -->
    <h3 class="section-title">Hot Games</h3>
    <div class="games-grid">
        <div class="game-card">
            <img src="https://via.placeholder.com/100" alt="Game">
            <span>Super Ace</span>
        </div>
        <div class="game-card">
            <img src="https://via.placeholder.com/100" alt="Game">
            <span>Aviator</span>
        </div>
        <div class="game-card">
            <img src="https://via.placeholder.com/100" alt="Game">
            <span>Fortune Gems</span>
        </div>
        <div class="game-card">
            <img src="https://via.placeholder.com/100" alt="Game">
            <span>Boxing King</span>
        </div>
        <div class="game-card">
            <img src="https://via.placeholder.com/100" alt="Game">
            <span>Money Coming</span>
        </div>
        <div class="game-card">
            <img src="https://via.placeholder.com/100" alt="Game">
            <span>7Up 7Down</span>
        </div>
    </div>

</body>
</html>
