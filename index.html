<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>TikTok2</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
}

.app{
  max-width:500px;
  margin:auto;
  min-height:100vh;
  background:#111;
  padding-bottom:70px;
}

.header{
  position:fixed;
  top:0;
  width:100%;
  max-width:500px;
  height:60px;
  background:#000d;
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  z-index:10;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.admin-btn{
  background:#ff0050;
  color:white;
  border:0;
  padding:8px 12px;
  border-radius:20px;
}

.feed{
  padding-top:60px;
}

.video-card{
  min-height:650px;
  position:relative;
  border-bottom:1px solid #333;
  background:#000;
}

.video-box{
  width:100%;
  height:650px;
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.video-box video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.demo-video{
  font-size:80px;
}

.video-info{
  position:absolute;
  bottom:20px;
  left:15px;
  right:90px;
  text-shadow:0 2px 5px #000;
}

.username{
  font-weight:bold;
  font-size:18px;
  margin-bottom:8px;
}

.caption{
  font-size:15px;
}

.actions{
  position:absolute;
  right:10px;
  bottom:80px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.action{
  width:55px;
  height:55px;
  border:0;
  border-radius:50%;
  background:#222c;
  color:white;
  font-size:12px;
}

.action span{
  display:block;
  font-size:23px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  max-width:500px;
  height:65px;
  background:#111;
  border-top:1px solid #333;
  display:flex;
  z-index:20;
}

.nav-btn{
  flex:1;
  background:none;
  border:0;
  color:#aaa;
  font-size:13px;
}

.nav-btn.active{
  color:white;
}

.nav-icon{
  font-size:23px;
  display:block;
  margin-bottom:3px;
}

.page{
  padding:80px 15px 90px;
}

.box{
  background:#1c1c1c;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
}

input,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:1px solid #444;
  border-radius:10px;
  background:#292929;
  color:white;
}

textarea{
  min-height:100px;
  resize:none;
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  background:#333;
  color:white;
  margin:4px;
}

.primary{
  background:#ff0050;
}

.green{
  background:#087f3b;
}

.red{
  background:#9d2222;
}

.stats{
  display:flex;
  gap:8px;
}

.stat{
  flex:1;
  background:#252525;
  padding:12px;
  border-radius:10px;
  text-align:center;
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:flex;
  align-items:flex-end;
  z-index:50;
}

.modal.hidden{
  display:none;
}

.sheet{
  width:100%;
  max-width:500px;
  margin:auto;
  background:#181818;
  border-radius:20px 20px 0 0;
  padding:20px;
  max-height:80vh;
  overflow:auto;
}

.comment{
  padding:10px 0;
  border-bottom:1px solid #333;
}

.message{
  background:#252525;
  padding:10px;
  border-radius:10px;
  margin:8px 0;
}

.empty{
  text-align:center;
  padding:80px 20px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">🎵 TikTok2</div>
  <button class="admin-btn" onclick="openAdmin()">👑 Admin</button>
</header>

<main id="content"></main>

<nav class="bottom-nav">
  <button class="nav-btn active" onclick="home()">
    <span class="nav-icon">🏠</span>Home
  </button>

  <button class="nav-btn" onclick="uploadPage()">
    <span class="nav-icon">➕</span>Upload
  </button>

  <button class="nav-btn" onclick="profile()">
    <span class="nav-icon">👤</span>Profile
  </button>
</nav>

</div>

<div id="modal" class="modal hidden">
  <div class="sheet" id="sheet"></div>
</div>

<script>

/* =========================
   TikTok2 DATA
========================= */

let data = JSON.parse(localStorage.getItem("TikTok2Data"));

if(!data){

  data = {

    user:{
      name:"TikTok2 User",
      bio:"TikTok2-এ স্বাগতম ❤️"
    },

    videos:[
      {
        id:1,
        username:"TikTok2",
        caption:"TikTok2-এ স্বাগতম! 🎵",
        likes:10,
        views:100,
        comments:["স্বাগতম TikTok2! ❤️"],
        video:""
      }
    ],

    messages:[],

    users:1

  };

  save();

}

function save(){

  localStorage.setItem(
    "TikTok2Data",
    JSON.stringify(data)
  );

}


/* =========================
   HOME
========================= */

function home(){

  let html="";

  if(data.videos.length===0){

    html=`
      <div class="feed">
        <div class="empty">
          এখনো কোনো ভিডিও নেই।<br><br>
          প্রথম ভিডিওটি আপনি Upload করুন 🎥
        </div>
      </div>
    `;

  }else{

    data.videos.forEach(v=>{

      html+=`

      <div class="video-card">

        <div class="video-box">

          ${
            v.video
            ?
            `<video src="${v.video}"
                    controls
                    loop
                    playsinline
                    onclick="addView(${v.id})">
            </video>`
            :
            `<div class="demo-video">🎵</div>`
          }

        </div>

        <div class="video-info">

          <div class="username">
            @${escapeHTML(v.username)}
          </div>

          <div class="caption">
            ${escapeHTML(v.caption)}
          </div>

        </div>

        <div class="actions">

          <button class="action"
                  onclick="likeVideo(${v.id})">

            <span>❤️</span>
            ${v.likes}

          </button>

          <button class="action"
                  onclick="comments(${v.id})">

            <span>💬</span>
            ${v.comments.length}

          </button>

          <button class="action"
                  onclick="shareVideo(${v.id})">

            <span>↗️</span>
            Share

          </button>

          <button class="action">

            <span>👁️</span>
            ${v.views}

          </button>

        </div>

      </div>

      `;

    });

  }

  document.getElementById("content").innerHTML =
    `<div class="feed">${html}</div>`;

}


/* =========================
   LIKE
========================= */

function likeVideo(id){

  let video=data.videos.find(v=>v.id===id);

  if(video){

    video.likes++;

    save();

    home();

  }

}


/* =========================
   VIEW
========================= */

function addView(id){

  let video=data.videos.find(v=>v.id===id);

  if(video){

    video.views++;

    save();

  }

}


/* =========================
   SHARE
========================= */

function shareVideo(id){

  let video=data.videos.find(v=>v.id===id);

  let text=
    "TikTok2 ভিডিও: "+
    video.caption;

  if(navigator.share){

    navigator.share({
      title:"TikTok2",
      text:text
    });

  }else{

    navigator.clipboard.writeText(text);

    alert("ভিডিওর তথ্য কপি হয়েছে!");

  }

}


/* =========================
   COMMENTS
========================= */

function comments(id){

  let video=data.videos.find(v=>v.id===id);

  let commentsHTML="";

  video.comments.forEach(c=>{

    commentsHTML+=`
      <div class="comment">
        💬 ${escapeHTML(c)}
      </div>
    `;

  });

  document.getElementById("sheet").innerHTML=`

    <h2>💬 Comments</h2>

    <br>

    ${commentsHTML}

    <br>

    <input
      id="commentInput"
      placeholder="মন্তব্য লিখুন..."
    >

    <button
      class="btn primary"
      onclick="addComment(${id})">

      মন্তব্য পাঠান

    </button>

    <button
      class="btn"
      onclick="closeModal()">

      বন্ধ

    </button>

  `;

  openModal();

}


function addComment(id){

  let input=
    document.getElementById("commentInput");

  let text=input.value.trim();

  if(!text){

    alert("মন্তব্য লিখুন");

    return;

  }

  let video=
    data.videos.find(v=>v.id===id);

  video.comments.push(text);

  save();

  closeModal();

  home();

}


/* =========================
   UPLOAD PAGE
========================= */

function uploadPage(){

  document.getElementById("content").innerHTML=`

    <div class="page">

      <h2>🎥 ভিডিও Upload</h2>

      <div class="box">

        <input
          type="file"
          id="videoFile"
          accept="video/*">

        <textarea
          id="videoCaption"
          placeholder="ভিডিওর ক্যাপশন লিখুন...">
        </textarea>

        <button
          class="btn primary"
          onclick="uploadVideo()">

          🚀 ভিডিও Upload

        </button>

      </div>

      <div class="box">

        <b>⚠️ Demo Version</b>

        <p style="margin-top:10px;color:#aaa">

          এই Demo-তে ভিডিও আপনার ডিভাইসের
          Local Storage-এ রাখা হবে।

          আসল অ্যাপের জন্য Cloud Storage
          ও Database ব্যবহার করতে হবে।

        </p>

      </div>

    </div>

  `;

}


function uploadVideo(){

  let file=
    document.getElementById("videoFile").files[0];

  let caption=
    document.getElementById("videoCaption").value;

  if(!file){

    alert("একটি ভিডিও নির্বাচন করুন");

    return;

  }

  let reader=new FileReader();

  reader.onload=function(e){

    data.videos.unshift({

      id:Date.now(),

      username:data.user.name,

      caption:caption || "আমার TikTok2 ভিডিও 🎵",

      likes:0,

      views:0,

      comments:[],

      video:e.target.result

    });

    save();

    alert("ভিডিও Upload হয়েছে! 🎉");

    home();

  };

  reader.readAsDataURL(file);

}


/* =========================
   PROFILE
========================= */

function profile(){

  document.getElementById("content").innerHTML=`

    <div class="page">

      <h2>👤 My Profile</h2>

      <div class="box">

        <h3>
          ${escapeHTML(data.user.name)}
        </h3>

        <p style="color:#aaa;margin-top:8px">
          ${escapeHTML(data.user.bio)}
        </p>

      </div>

      <div class="stats">

        <div class="stat">
          🎥<br>
          ${data.videos.length}
          <br>
          Videos
        </div>

        <div class="stat">
          ❤️<br>
          ${totalLikes()}
          <br>
          Likes
        </div>

        <div class="stat">
          👁️<br>
          ${totalViews()}
          <br>
          Views
        </div>

      </div>

      <br>

      <div class="box">

        <h3>✏️ Edit Profile</h3>

        <input
          id="profileName"
          value="${escapeHTML(data.user.name)}">

        <textarea
          id="profileBio">${escapeHTML(data.user.bio)}</textarea>

        <button
          class="btn primary"
          onclick="saveProfile()">

          Save Profile

        </button>

      </div>


      <div class="box">

        <h3>💬 Admin-কে নক করুন</h3>

        <textarea
          id="adminMessage"
          placeholder="Admin-কে মেসেজ লিখুন...">
        </textarea>

        <button
          class="btn primary"
          onclick="sendAdminMessage()">

          📩 মেসেজ পাঠান

        </button>

      </div>

    </div>

  `;

}


function saveProfile(){

  data.user.name=
    document.getElementById("profileName").value
    || "TikTok2 User";

  data.user.bio=
    document.getElementById("profileBio").value;

  save();

  profile();

}


function sendAdminMessage(){

  let text=
    document.getElementById("adminMessage").value.trim();

  if(!text){

    alert("মেসেজ লিখুন");

    return;

  }

  data.messages.push({

    id:Date.now(),

    user:data.user.name,

    text:text,

    reply:""

  });

  save();

  alert("Admin-এর কাছে মেসেজ পাঠানো হয়েছে।");

  profile();

}


/* =========================
   ADMIN PANEL
========================= */

function openAdmin(){

  document.getElementById("sheet").innerHTML=`

    <h2>👑 Admin Login</h2>

    <p style="color:#aaa;margin:10px 0">

      TikTok2 Owner / Admin

    </p>

    <input
      type="password"
      id="adminPassword"
      placeholder="Admin Password">

    <button
      class="btn primary"
      onclick="adminLogin()">

      🔐 Login

    </button>

    <button
      class="btn"
      onclick="closeModal()">

      বন্ধ

    </button>

  `;

  openModal();

}


/*
 DEMO PASSWORD

 1234

 Production version-এ
 server-side authentication
 ব্যবহার করতে হবে।
*/

function adminLogin(){

  let password=
    document.getElementById("adminPassword").value;

  if(password!=="1234"){

    alert("Password সঠিক নয়");

    return;

  }

  adminDashboard();

}


function adminDashboard(){

  let messages="";

  if(data.messages.length===0){

    messages=
      `<p style="color:#aaa">
        কোনো Admin Message নেই।
       </p>`;

  }else{

    data.messages.forEach(m=>{

      messages+=`

        <div class="message">

          <b>👤 ${escapeHTML(m.user)}</b>

          <p>${escapeHTML(m.text)}</p>

          ${
            m.reply
            ?
            `<p style="color:#5cff9d">
              👑 Reply: ${escapeHTML(m.reply)}
             </p>`
            :
            `<button
              class="btn green"
              onclick="replyMessage(${m.id})">

              Reply

             </button>`
          }

        </div>

      `;

    });

  }


  let videos="";

  data.videos.forEach(v=>{

    videos+=`

      <div class="message">

        <b>${escapeHTML(v.username)}</b>

        <p>${escapeHTML(v.caption)}</p>

        👁️ ${v.views}
        &nbsp;
        ❤️ ${v.likes}

        <br>

        <button
          class="btn red"
          onclick="deleteVideo(${v.id})">

          🗑️ Delete

        </button>

      </div>

    `;

  });


  document.getElementById("sheet").innerHTML=`

    <h2>👑 Admin Dashboard</h2>

    <div class="stats">

      <div class="stat">
        👥<br>
        ${data.users}<br>
        Users
      </div>

      <div class="stat">
        🎥<br>
        ${data.videos.length}<br>
        Videos
      </div>

      <div class="stat">
        👁️<br>
        ${totalViews()}<br>
        Views
      </div>

    </div>

    <br>

    <div class="box">

      <h3>💰 Monetization</h3>

      <p style="color:#aaa">
        এখানে ভবিষ্যতে বৈধ Ad Network-এর
        Revenue যুক্ত করা যাবে।
      </p>

      <br>

      <b>
        Demo Revenue: ৳0.00
      </b>

    </div>

    <div class="box">

      <h3>💬 Admin Messages</h3>

      ${messages}

    </div>

    <div class="box">

      <h3>🎥 Video Management</h3>

      ${videos}

    </div>

    <button
      class="btn"
      onclick="closeModal()">

      বন্ধ

    </button>

  `;

}


/* =========================
   ADMIN REPLY
========================= */

function replyMessage(id){

  let reply=
    prompt("Admin Reply লিখুন:");

  if(!reply){

    return;

  }

  let message=
    data.messages.find(m=>m.id===id);

  if(message){

    message.reply=reply;

  }

  save();

  adminDashboard();

}


/* =========================
   DELETE VIDEO
========================= */

function deleteVideo(id){

  if(!confirm("এই ভিডিওটি Delete করবেন?")){

    return;

  }

  data.videos=
    data.videos.filter(v=>v.id!==id);

  save();

  adminDashboard();

}


/* =========================
   TOTALS
========================= */

function totalLikes(){

  return data.videos.reduce(
    (sum,v)=>sum+v.likes,0
  );

}

function totalViews(){

  return data.videos.reduce(
    (sum,v)=>sum+v.views,0
  );

}


/* =========================
   MODAL
========================= */

function openModal(){

  document
    .getElementById("modal")
    .classList.remove("hidden");

}

function closeModal(){

  document
    .getElementById("modal")
    .classList.add("hidden");

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START APP
========================= */

home();

</script>

</body>
  </html>
