<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন পেজ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>লগইন করুন</h2>
        <form>
            <div class="input-group">
                <label>মোবাইল নম্বর বা ইমেইল</label>
                <input type="text" placeholder="আপনার নম্বর দিন" required>
            </div>
            <div class="input-group">
                <label>পাসওয়ার্ড</label>
                <input type="password" placeholder="পাসওয়ার্ড দিন" required>
            </div>
            <button type="submit" class="submit-btn">লগইন</button>
        </form>
    </div>
</body>
</html>
